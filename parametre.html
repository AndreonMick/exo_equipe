<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paramètres</title>
    <!-- CSS compilé depuis le SCSS -->
    <link rel="stylesheet" href="css/settings.css">
</head>
<body>

    <main class="settings">
        <h1 class="settings__title">Paramètres</h1>

        <section class="settings__section">
            <h2>Compte</h2>
            <label>
                Nom d’utilisateur
                <input type="text" placeholder="Votre nom">
            </label>
        </section>

        <section class="settings__section">
            <h2>Préférences</h2>
            <label class="switch">
                <input type="checkbox">
                <span>Mode sombre</span>
            </label>
        </section>

        <button class="settings__save">Enregistrer</button>
    </main>

</body>
</html>
